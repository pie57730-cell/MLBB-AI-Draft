
name: Build MLBB APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Extract Android project
        run: |
          mkdir -p project
          unzip -o MLBB_AI_Draft_Assistant.zip -d project

      - name: Check project files
        run: |
          echo "Checking Android project..."
          find project -name settings.gradle -o -name settings.gradle.kts
          find project -name build.gradle -o -name build.gradle.kts

      - name: Build APK
        run: |
          gradle -p project assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MLBB-Draft-Assistant-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
